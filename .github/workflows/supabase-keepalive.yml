# ─────────────────────────────────────────────────────────────────────────────
# Supabase Keepalive — Prevent free-tier auto-pause
#
# Supabase free tier pauses database after 1 week of inactivity.
# This workflow pings the database once every 2 days to keep it active
# (reduced from every 5 minutes — that was overkill and contributing to
# connection noise on the free tier).
#
# Setup:
#   Set these GitHub Secrets (Settings → Secrets and variables → Actions):
#   - NEXT_PUBLIC_SUPABASE_URL  (e.g. https://xxxxx.supabase.co)
#   - SUPABASE_SERVICE_KEY      (service_role key)
# ═══════════════════════════════════════════════════════════════════════════

name: Supabase Keepalive

on:
  schedule:
    - cron: "0 0 */2 * *"  # Every 2 days at 00:00 UTC
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "⚠ Supabase secrets not set. Skipping."
            echo "Set NEXT_PUBLIC_SUPABASE_URL + SUPABASE_SERVICE_KEY in repo secrets."
            exit 0
          fi

          echo "🔄 Pinging Supabase REST API to prevent pause..."
          # Ping the REST API root (counts as database activity)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "${SUPABASE_URL}/rest/v1/" \
            --max-time 10)

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ]; then
            echo "✅ Supabase REST API pinged (HTTP $HTTP_CODE)"
          else
            echo "⚠ REST API ping returned HTTP $HTTP_CODE (may be normal)"
          fi

          # Also do a real database query via PostgREST (counts as DB activity)
          echo "🔄 Querying Member table (real DB round-trip)..."
          DB_HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Range: 0-0" \
            "${SUPABASE_URL}/rest/v1/Member?select=id&limit=1" \
            --max-time 10)

          if [ "$DB_HTTP" = "200" ] || [ "$DB_HTTP" = "206" ]; then
            echo "✅ Database queried successfully (HTTP $DB_HTTP)"
          else
            echo "⚠ DB query returned HTTP $DB_HTTP (table may not exist yet)"
          fi

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Keepalive complete — Supabase will not pause"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
